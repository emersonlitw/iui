</style></head><body class="iso" data-theme="light"><script>try{var q=matchMedia("(prefers-color-scheme: dark)");var f=function(){document.body.dataset.theme=q.matches?"dark":"light"};f();q.addEventListener("change",f)}catch(e){}</script><main class="iso-page"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">圖 1</span><span class="iso-plate-corner" data-corner="title">IUI</span><span class="iso-plate-corner" data-corner="hint">點按 · 拖曳</span><span class="iso-plate-corner" data-corner="readout" data-readout>5/7 推注精蟲</span></div><div class="ic-stage" tabindex="0" role="group" aria-roledescription="分步圖解" aria-label="IUI 人工授精七個步驟。左右方向鍵切換步驟，空白鍵播放或暫停。"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 293" role="img" aria-label="IUI 人工授精的示意圖。第 1 至 3 步是實驗室：一支直立的錐底離心管，管內下方是兩層分層液，精液放在最上層。右上圓框先放大顯示洗滌前精液裡雜亂的精蟲、其他細胞與碎屑，接著換成從上往下看的離心機：十字形轉子的中央轉軸連著四支臂，臂端各有一個管槽；精液管放在其中一個管槽，管口以深色粗圈表示，正對面的管槽放一支顏色較淡、用來配重的平衡管，另外兩個管槽空著；轉子加速旋轉、再慢慢停回原位，共轉 70 圈，同時管底出現精蟲沉澱。第 2 步取出沉澱、加培養液洗一次再離心，移除上方液體，留下約 0.5 mL（管底沉澱和少量液體），再加入 0.5 mL 培養液輕輕混勻，共 1.0 mL；右上放大圓框顯示洗滌後較乾淨、精蟲較密的樣子：圓框內 20 隻精蟲，19 隻往前游、1 隻在原地擺動，附 20 µm 比例尺。第 3 步離心管以管底為支點，慢慢往右傾斜到 45 度，同時縮小到原來的 0.4 倍，與注射筒相同；6 Fr IUI 導管接在 3 mL 注射筒上，整組成一直線，從畫面右上方外沿著管子的中軸線滑進管口，尖端到管底的精蟲懸浮液，不碰管壁；接著拉回推桿吸入 1.0 mL：精蟲懸浮液先從導管尖端填滿導管（約 0.2 mL），其餘 0.8 mL 進入注射筒；吸的後半段，整組隨液面往管底再深入一點，尖端一直在液面下，直到離心管內的液體吸乾。第 4 步起畫面換成子宮：子宮與子宮頸以正中矢狀切面剖半，切面朝向觀看者，子宮底在左、子宮頸在右，可看到子宮腔與內膜。6 Fr IUI 導管從畫面右邊經子宮頸外口、子宮頸管進入子宮腔，尾端接著 3 mL 注射筒，導管內裝有洗滌後的精蟲，前端不碰觸子宮腔頂部。第 5 步慢慢推動活塞，將 1.0 mL 精蟲懸浮液送進子宮腔，推完後導管與注射筒內都沒有液體。圖中以灰色表示送進子宮腔的精蟲懸浮液。第 6 步慢慢退出導管。第 7 步右上放大圓框顯示精蟲在子宮腔液中往輸卵管方向游動，附 20 µm 比例尺。"><desc>IUI 人工授精互動圖解 v16。作者：李日升醫師（Dr. EmersonLi）；© 2026 李日升醫師，CC BY-NC-ND 4.0。https://emersonlitw.github.io/iui/</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>IUI 人工授精 v16
